name: tarteel_studio
description: Offline-first Quran video studio for Android.
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^8.1.4
  just_audio: ^0.9.42
  path_provider: ^2.1.4
  ffmpeg_kit_flutter_new_video: ^2.5.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
